# Floci: a local AWS emulator. Here it plays CloudFront, routing /app/ to the
# Flutter dev server and everything else to the index, as the deployed stack
# would (tabscan_infra/site.yaml), over HTTP and HTTPS.
# Started by `devbox services up` (4-floci in process-compose.yaml).
services:
  floci:
    # The compat image has the AWS CLI, which the init hook uses. A dated
    # nightly: 2.1.0 forwards no viewer headers to custom origins. Move to the
    # next release once it ships. Pinned by digest (the multi-arch index;
    # `docker buildx imagetools inspect floci/floci:<tag>` shows it), so a
    # re-pushed tag can't change what runs here.
    image: floci/floci:nightly-09242026-compat@sha256:eb725a12cd80bbbcb476a33c0a1d98382a54d5c9f39c4c31b160f7cdf9cf1a6e
    container_name: tabscan-floci
    ports:
      - "127.0.0.1:${FLOCI_PORT:-2014}:4566"
      # HTTPS with the mkcert certificate (FLOCI_PORT also answers HTTPS)
      - "127.0.0.1:${FLOCI_HTTPS_PORT:-2443}:8443"
    extra_hosts:
      # The origin host (see init/ready.d/10-cloudfront.sh): the Docker host
      # in here, loopback in the browser.
      - "${TABSCANNER_ORIGIN_HOST:-dev.tabscan.localhost}:host-gateway"
    environment:
      # Stateless: the ready hook recreates the distribution on every start.
      FLOCI_STORAGE_MODE: memory
      # Local HTTPS: the certificate from scripts/local-certs.sh (mkcert),
      # served on 8443 as well as 4566. 8443 instead of the default 443
      # avoids binding a privileged port.
      FLOCI_TLS_ENABLED: "true"
      FLOCI_TLS_CERT_PATH: /etc/tabscan-certs/tabscan.pem
      FLOCI_TLS_KEY_PATH: /etc/tabscan-certs/tabscan-key.pem
      FLOCI_TLS_AWS_HTTPS_PORT: "8443"
      # CloudFront refuses private origins unless they're listed here.
      FLOCI_SERVICES_CLOUDFRONT_ALLOWED_PRIVATE_ORIGIN_HOSTS: ${TABSCANNER_ORIGIN_HOST:-dev.tabscan.localhost}
      TABSCANNER_ORIGIN_HOST: ${TABSCANNER_ORIGIN_HOST:-dev.tabscan.localhost}
      TABSCANNER_CDN_ALIAS: ${TABSCANNER_CDN_ALIAS:-tabscan.localhost}
      TABSCANNER_PUBLIC_HOST: ${TABSCANNER_PUBLIC_HOST:-local.tabscan.nu01.com}
      FLUTTER_WEB_PORT: ${FLUTTER_WEB_PORT:-2012}
      INDEX_PORT: ${INDEX_PORT:-2013}
      # Only for the hook's log line: the host ports.
      FLOCI_PORT: ${FLOCI_PORT:-2014}
      FLOCI_HTTPS_PORT: ${FLOCI_HTTPS_PORT:-2443}
    volumes:
      - ./init/ready.d:/etc/floci/init/ready.d:ro
      - ./certs:/etc/tabscan-certs:ro
