# Deploys a release candidate to https://rc.tabcam.nu01.com: every pushed
# tag matching *RC* (e.g. 0.2.202609271200-RC1, from scripts/release-rc.sh),
# or a manual run. It runs scripts/deploy.sh with STAGE=rc, which uses the
# RC's own stack (tabcam-rc-web), and ends by checking that the RC site
# serves this version.
#
# AWS access is keyless: GitHub's OIDC token is exchanged for the
# tabcam-github-deploy-rc role (tabcam_infra/github-deploy.yaml). That
# role trusts only *RC* tag runs and manual runs from main, and may only
# manage tabcam-rc-* resources and the rc.tabcam.nu01.com records. Its
# ARN is the repository variable TABCAM_AWS_DEPLOY_RC_ROLE_ARN.
#
# The Release workflow runs on the same tags and publishes the binaries as
# a prerelease.
name: Deploy RC

on:
  push:
    tags:
      - "*RC*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy (e.g. 0.2.202609271200-RC1). Empty deploys the selected branch's commit.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

# One RC deploy at a time; a newer one waits for the running one.
concurrency:
  group: deploy-rc
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject, which the
    # RC role matches (the tag, or refs/heads/main for manual runs).
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          else
            tag=""
          fi
          if [[ -n "$tag" && ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid tag '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying ${tag:-the current commit} to rc.tabcam.nu01.com"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Show the toolchain
        run: |
          flutter --version
          aws --version

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TABCAM_AWS_DEPLOY_RC_ROLE_ARN }}
          role-session-name: tabcam-deploy-rc-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ${{ steps.tag.outputs.tag || github.sha }} to RC
        env:
          STAGE: rc
          TAG: ${{ steps.tag.outputs.tag }}
          TABCAM_HOSTED_ZONE_ID: ${{ vars.TABCAM_HOSTED_ZONE_ID }}
          # Sign-in and cloud sync (public identifiers; empty turns them off).
          TABCAM_GOOGLE_WEB_CLIENT_ID: ${{ vars.TABCAM_GOOGLE_WEB_CLIENT_ID }}
          TABCAM_COGNITO_IDENTITY_POOL_ID: ${{ vars.TABCAM_COGNITO_IDENTITY_POOL_ID }}
          TABCAM_USER_DATA_BUCKET: ${{ vars.TABCAM_USER_DATA_BUCKET }}
          TABCAM_SHARE_API_URL: ${{ vars.TABCAM_SHARE_API_URL }}
          TABCAM_OCR_URL: ${{ vars.TABCAM_OCR_URL }}
          TABCAM_EMAIL_USER_POOL_ID: ${{ vars.TABCAM_EMAIL_USER_POOL_ID }}
          TABCAM_EMAIL_CLIENT_ID: ${{ vars.TABCAM_EMAIL_CLIENT_ID }}
          TABCAM_CDN_KEY_GROUP_ID: ${{ vars.TABCAM_CDN_KEY_GROUP_ID }}
        run: bash scripts/deploy.sh
