# Builds the app binaries with `make` (web, Android, iOS) and publishes
# them as a GitHub release.
#
# - Tag pushes matching *QA or *RC* (e.g. 1.2.0-QA, 1.2.0-RC1) release that
#   tag as a prerelease; *GA tags (e.g. 1.2.0-GA) as the latest full
#   release. scripts/release-rc.sh and scripts/release-ga.sh push them.
# - Manual dispatch releases the chosen tag, creating it on the dispatched
#   commit if it doesn't exist yet.
# - Pull requests that change the build only build (no release), so a broken
#   build shows up before a tag does.
# - Android is signed with the upload key from the secrets
#   ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD (see
#   scripts/android-keystore.sh), except on pull requests, which never get
#   them; without them it's signed with a throwaway debug key.
name: Release

on:
  push:
    tags:
      - "*QA"
      - "*RC*"
      - "*GA"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created on this commit if missing). Empty uses the selected tag, or manual-<run number>.
        required: false
        type: string
      prerelease:
        description: Mark as a prerelease
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Makefile
      - tabcam_app/android/app/build.gradle.kts
      - scripts/make.sh
      - scripts/dart-defines.sh
      - scripts/version.sh
      - version.X.txt
      - version.Y.txt

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_z: ${{ steps.version.outputs.version_z }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: tag
        name: Resolve the release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$EVENT" == pull_request ]]; then
            tag="pr-$PR_NUMBER"
          elif [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          else
            tag="manual-$RUN_NUMBER"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid tag '$tag': use letters, digits, '.', '_' and '-'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      # One version for every platform's build. A tag that carries X.Y.Z
      # (e.g. 1.0.202609261530-RC) keeps its Z, and its X.Y must match the
      # version files; any other build gets Z from the current time.
      - id: version
        name: Resolve the version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.*)?$ ]]; then
            export VERSION_Z="${BASH_REMATCH[3]}"
            tag_xy="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          fi
          source scripts/version.sh
          if [[ -n "${tag_xy:-}" && "$tag_xy" != "$VERSION_X.$VERSION_Y" ]]; then
            echo "::error::Tag $TAG is version $tag_xy, but version.X.txt/version.Y.txt say $VERSION_X.$VERSION_Y"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "version_z=$VERSION_Z"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (build $BUILD_NUMBER)"

  build:
    needs: prepare
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            name: web
            make: web
            os: ubuntu-latest
          - target: android
            name: android
            make: android appbundle
            os: ubuntu-latest
          - target: ios
            name: ios
            make: ios
            os: macos-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
      MAKE_TARGETS: ${{ matrix.make }}
      VERSION_Z: ${{ needs.prepare.outputs.version_z }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      # Sign-in and cloud sync (public identifiers; empty turns them off).
      TABCAM_GOOGLE_WEB_CLIENT_ID: ${{ vars.TABCAM_GOOGLE_WEB_CLIENT_ID }}
      TABCAM_GOOGLE_IOS_CLIENT_ID: ${{ vars.TABCAM_GOOGLE_IOS_CLIENT_ID }}
      TABCAM_COGNITO_IDENTITY_POOL_ID: ${{ vars.TABCAM_COGNITO_IDENTITY_POOL_ID }}
      TABCAM_USER_DATA_BUCKET: ${{ vars.TABCAM_USER_DATA_BUCKET }}
      TABCAM_SHARE_API_URL: ${{ vars.TABCAM_SHARE_API_URL }}
      TABCAM_OCR_URL: ${{ vars.TABCAM_OCR_URL }}
      TABCAM_CDN_URL: ${{ vars.TABCAM_CDN_URL }}
      TABCAM_EMAIL_USER_POOL_ID: ${{ vars.TABCAM_EMAIL_USER_POOL_ID }}
      TABCAM_EMAIL_CLIENT_ID: ${{ vars.TABCAM_EMAIL_CLIENT_ID }}
      # Sign in with Apple: Android's web flow only. CI's iOS build is
      # unsigned, so it can't carry the entitlement the flag adds.
      TABCAM_APPLE_SIGN_IN: ${{ matrix.target == 'android' && vars.TABCAM_APPLE_SIGN_IN || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.target == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Show the toolchain
        run: flutter --version

      # The upload key, for tags and manual runs (pull requests get no
      # secrets). key.properties is git-ignored; the runner is thrown away.
      - if: matrix.target == 'android' && github.event_name != 'pull_request'
        name: Set up the Android upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::warning::No upload key secrets: Android is signed with a debug key"
            exit 0
          fi
          umask 077
          keystore="$RUNNER_TEMP/upload.jks"
          base64 --decode > "$keystore" <<< "$KEYSTORE_BASE64"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$keystore" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" \
            > tabcam_app/android/key.properties

      - name: make ${{ matrix.make }}
        # Word splitting is wanted: MAKE_TARGETS is the matrix's list.
        run: make $MAKE_TARGETS

      - name: Package
        run: |
          dist="$PWD/dist"
          mkdir -p "$dist"
          cd tabcam_app/build
          case "$TARGET" in
            web)
              (cd web && zip -qr "$dist/tabcam-$TAG-web.zip" .)
              ;;
            android)
              cp app/outputs/flutter-apk/app-release.apk "$dist/tabcam-$TAG-android.apk"
              cp app/outputs/bundle/release/app-release.aab "$dist/tabcam-$TAG-android.aab"
              ;;
            ios)
              ditto -c -k --keepParent ios/iphoneos/Runner.app "$dist/tabcam-$TAG-ios-unsigned.zip"
              ;;
          esac
          ls -l "$dist"

      - if: always() && matrix.target == 'android'
        name: Remove the upload key
        run: rm -f "$RUNNER_TEMP/upload.jks" tabcam_app/android/key.properties

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabcam-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tabcam-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ (github.event_name == 'push' && !endsWith(github.ref_name, 'GA')) || (github.event_name != 'push' && inputs.prerelease) }}
        run: |
          ls -l dist
          title="tabcam-$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title"
          else
            flags=(--title "$title" --generate-notes --target "$GITHUB_SHA")
            [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
