# Deploys a *GA tag to production, https://tabcam.nu01.com: the Flutter
# web app (/app/) and the index page (/), through scripts/deploy.sh. It
# ends by checking that the live site serves this tag's version.
#
# AWS access is keyless: GitHub's OIDC token is exchanged for the
# tabcam-github-deploy role (tabcam_infra/github-deploy.yaml), which
# only trusts *GA tag runs of this repository. Its ARN is the repository
# variable TABCAM_AWS_DEPLOY_ROLE_ARN.
#
# The Release workflow runs on the same tags and publishes the binaries.
name: Deploy

on:
  push:
    tags:
      - "*GA"

permissions:
  contents: read
  id-token: write

# One production deploy at a time; a newer tag waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject from the tag
    # (repo:…:ref:refs/tags/X.Y.Z-GA), which the deploy role trusts, to the
    # environment name.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Show the toolchain
        run: |
          flutter --version
          aws --version

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TABCAM_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: tabcam-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ${{ github.ref_name }}
        env:
          TAG: ${{ github.ref_name }}
          TABCAM_HOSTED_ZONE_ID: ${{ vars.TABCAM_HOSTED_ZONE_ID }}
          # Sign-in and cloud sync (public identifiers; empty turns them off).
          TABCAM_GOOGLE_WEB_CLIENT_ID: ${{ vars.TABCAM_GOOGLE_WEB_CLIENT_ID }}
          TABCAM_COGNITO_IDENTITY_POOL_ID: ${{ vars.TABCAM_COGNITO_IDENTITY_POOL_ID }}
          TABCAM_USER_DATA_BUCKET: ${{ vars.TABCAM_USER_DATA_BUCKET }}
          TABCAM_SHARE_API_URL: ${{ vars.TABCAM_SHARE_API_URL }}
          TABCAM_OCR_URL: ${{ vars.TABCAM_OCR_URL }}
          TABCAM_EMAIL_USER_POOL_ID: ${{ vars.TABCAM_EMAIL_USER_POOL_ID }}
          TABCAM_EMAIL_CLIENT_ID: ${{ vars.TABCAM_EMAIL_CLIENT_ID }}
          TABCAM_CDN_KEY_GROUP_ID: ${{ vars.TABCAM_CDN_KEY_GROUP_ID }}
        run: bash scripts/deploy.sh

