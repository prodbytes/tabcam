AWSTemplateFormatVersion: '2010-09-09'
Description: >
  tabcam-web: the site at https://tabcam.nu01.com (and, as
  tabcam-rc-web, https://rc.tabcam.nu01.com). One CloudFront
  distribution in front of the index page (/) and the Flutter web app
  (/app/), both from a private S3 bucket. Uptime is watched from outside
  the stack (the nu01-monitor stack polls /app/version.json).
  Deploy in us-east-1 (CloudFront certificates must live there).

Parameters:
  DomainName:
    Type: String
    Default: tabcam.nu01.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The public zone of DomainName, tabcam.nu01.com's own (TABCAM_HOSTED_ZONE_ID)
  ShareApiDomain:
    Type: String
    Default: ''
    Description: >
      The share API's domain (TABCAM_SHARE_API_URL's host). With it,
      chat apps' crawlers asking for a capture's link get its preview page
      (/preview/<id>/<key>, from the API): its title, not the app's.
  RedirectTo:
    Type: String
    Default: ''
    Description: >
      Another domain this site has moved to (tabscan.nu01.com became
      tabcam.nu01.com): with it, every request is answered with a
      permanent redirect to the same path and query there, so links
      already shared keep working.

  CdnKeyGroupId:
    Type: String
    Default: ''
    Description: >
      The share API's CloudFront key group (tabcam-share-api's
      CdnKeyGroupId output, TABCAM_CDN_KEY_GROUP_ID). With it, the site
      also serves the user-data bucket's folders at their keys' paths
      (/<identity>/...), to signed URLs only (tabcam_api/shares/cdn.py),
      cached as the objects' Cache-Control says.
  IdentityRegion:
    Type: String
    Default: us-east-1
    Description: The identity pool's region, which starts every folder's name (<region>:<uuid>)

Conditions:
  HasPreviews: !Not [!Equals [!Ref ShareApiDomain, '']]
  HasCdn: !Not [!Equals [!Ref CdnKeyGroupId, '']]
  IsRedirect: !Not [!Equals [!Ref RedirectTo, '']]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Users' folders: each object kept as long as its Cache-Control says
  # (pages and videos a year, written once; event.json and OCR results
  # revalidated every time), not at all without one. The key is the path
  # alone: the signature's query string is checked, then left out, so
  # everyone allowed to read an object shares one copy.
  UserDataCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: HasCdn
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-user-data
        Comment: Users' folders, cached as their Cache-Control says
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only this distribution may read the bucket.
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          # S3 answers 403 for a missing key unless ListBucket is allowed;
          # this lets unknown paths return 404 instead.
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # /app -> /app/ (a redirect), and any directory URI -> its index.html, so
  # /app/ serves app/index.html from S3. A chat app's crawler asking for a
  # capture's link (/app/?c=<id>&k=<key>) goes to its preview page instead
  # (with previews on): the app's own page says only "TabCam", and
  # crawlers don't run the app. People are never sent there.
  AppIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-app-index
      AutoPublish: true
      FunctionConfig:
        Comment: Directory URIs to index.html; /app to /app/; link previews
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          var PREVIEWS = ${Previews};
          var REDIRECT = '${RedirectTo}';
          var CRAWLERS = /facebookexternalhit|facebot|twitterbot|slackbot|slack-imgproxy|whatsapp|telegrambot|discordbot|linkedinbot|skypeuripreview|microsoftpreview|teams|pinterest|redditbot|embedly|iframely|vkshare|applebot|googlebot|bingbot|google-pagerenderer|mastodon|bluesky|cardyb|snapchat|kakaotalk|viber|line-poker|zalo/i;
          function moved(request) {
            var q = request.querystring;
            var parts = [];
            Object.keys(q).forEach(function (k) {
              var v = q[k];
              (v.multiValue || [v]).forEach(function (m) {
                parts.push(m.value === '' ? k : k + '=' + m.value);
              });
            });
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://' + REDIRECT + request.uri +
                (parts.length ? '?' + parts.join('&') : '') } }
            };
          }
          function handler(event) {
            var request = event.request;
            var uri = request.uri;
            // The site moved: everything goes to the same place there.
            if (REDIRECT) {
              return moved(request);
            }
            if (uri === '/app') {
              return {
                statusCode: 301,
                statusDescription: 'Moved Permanently',
                headers: { location: { value: '/app/' } }
              };
            }
            if (PREVIEWS && (uri === '/app/' || uri === '/app/index.html')) {
              var q = request.querystring;
              var agent = request.headers['user-agent'];
              var c = q.c && q.c.value;
              var k = q.k && q.k.value;
              if (agent && CRAWLERS.test(agent.value) && c && k &&
                  /^[a-z0-9]{1,32}$/.test(c) && /^[A-Za-z0-9_-]{32,64}$/.test(k)) {
                return {
                  statusCode: 302,
                  statusDescription: 'Found',
                  headers: { location: { value: '/preview/' + c + '/' + k } }
                };
              }
            }
            if (uri.endsWith('/')) {
              request.uri = uri + 'index.html';
            }
            return request;
          }
        - Previews: !If [HasPreviews, 'true', 'false']
          RedirectTo: !Ref RedirectTo

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: TabCam (tabcam.nu01.com)
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          # Link previews' pages, from the share API; it's told which site
          # asks, to link back to it.
          - !If
            - HasPreviews
            - Id: share-api
              DomainName: !Ref ShareApiDomain
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
              OriginCustomHeaders:
                - HeaderName: x-tabcam-site
                  HeaderValue: !Ref DomainName
            - !Ref AWS::NoValue
          # Users' folders (tabcam-user-data's bucket, whose policy names
          # this distribution).
          - !If
            - HasCdn
            - Id: user-data
              DomainName: !Sub
                - ${Bucket}.s3.${AWS::Region}.amazonaws.com
                - Bucket: !ImportValue tabcam-user-data-bucket
              OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ''
            - !Ref AWS::NoValue
        # The index page at / (redirects to /app/)
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          # A moved site redirects the index page too.
          FunctionAssociations: !If
            - IsRedirect
            - - EventType: viewer-request
                FunctionARN: !GetAtt AppIndexFunction.FunctionMetadata.FunctionARN
            - !Ref AWS::NoValue
        CacheBehaviors:
          # Sign in with Apple's web flow (Android) posts its reply here,
          # the Services ID's return URL on TabCam's own domain; the share
          # API sends it back to the app. Never cached. Before /app*, which
          # matches /apple… too (the first matching path wins).
          - !If
            - HasPreviews
            - PathPattern: /apple/callback
              TargetOriginId: share-api
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
              ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            - !Ref AWS::NoValue
          # The Flutter web app, built with --base-href /app/
          - PathPattern: /app*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt AppIndexFunction.FunctionMetadata.FunctionARN
          # A capture link's preview page (crawlers are sent here), cached
          # as the API says (5 minutes).
          - !If
            - HasPreviews
            - PathPattern: /preview/*
              TargetOriginId: share-api
              ViewerProtocolPolicy: redirect-to-https
              Compress: true
              AllowedMethods: [GET, HEAD]
              CachedMethods: [GET, HEAD]
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
              ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            - !Ref AWS::NoValue
          # A user's folder, at its keys' paths (every folder is a Cognito
          # identity ID, <region>:<uuid>): signed URLs only, one folder's
          # each. Same origin as the web app, so no CORS.
          - !If
            - HasCdn
            - PathPattern: !Sub /${IdentityRegion}:*
              TargetOriginId: user-data
              ViewerProtocolPolicy: https-only
              Compress: true
              AllowedMethods: [GET, HEAD]
              CachedMethods: [GET, HEAD]
              TrustedKeyGroups: [!Ref CdnKeyGroupId]
              CachePolicyId: !Ref UserDataCachePolicy
              ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            - !Ref AWS::NoValue

  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's alias zone
        EvaluateTargetHealth: false

  DnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  SiteUrl:
    Value: !Sub https://${DomainName}/
  SiteBucketName:
    Description: Upload index.html at the root and the web build under app/
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionArn:
    Description: For tabcam-user-data's CdnDistributionArns
    Value: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
