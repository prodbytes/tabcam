AWSTemplateFormatVersion: '2010-09-09'
Description: >
  A Cognito identity pool that trusts Google sign-in and, with
  AppleClientId, Sign in with Apple, each through an IAM OpenID Connect
  provider that takes every TabCam client (Google's web, iOS and Android
  clients; Apple's bundle ID and Services ID): the pools' built-in logins
  take one client ID. The app exchanges the signed-in user's ID token for
  temporary AWS credentials of the authenticated role, which may only
  read, write and delete that user's own folder in the user-data bucket
  (tabcam-user-data stack). Guests aren't allowed. Deployed twice:
  tabcam-identity (pool tabcam) and tabcam-identity-local (pool
  tabcam-local, the local web client). An account has one provider per
  URL: tabcam-identity makes them, tabcam-identity-local uses Google's
  (GoogleProviderArn).

Parameters:
  GoogleWebClientId:
    Type: String
    Description: >
      The Google "Web application" OAuth client ID the pool trusts: the web
      client (every platform's ID token is issued for it: web directly,
      Android and iOS as their server client), or for the local pool the
      "local - web" client (TABCAM_GOOGLE_LOCAL_WEB_CLIENT_ID).
    AllowedPattern: '[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com'
  GoogleAppClientIds:
    Type: String
    Default: ''
    Description: >
      The other Google clients whose tokens the pools take, separated by
      commas: the iOS client, the "local - web" client (for the local
      pool) and each Android signing key's client. Only where the provider
      is made (GoogleProviderArn empty).
    AllowedPattern: '([0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com)?(,[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com)*'
  GoogleProviderArn:
    Type: String
    Default: ''
    Description: >
      The accounts.google.com OpenID Connect provider to use (the local
      pool: tabcam-identity's GoogleProviderArn output). Empty: this stack
      makes it.
  DeveloperProviderName:
    Type: String
    Default: ''
    Description: >
      The pool's developer provider (login.tabcam.profiles on the main
      pool): a profile's identity is the developer identity of its ID, which
      the share API vouches for. Set once: a pool's can't change. Empty:
      none (the local pool).
    AllowedPattern: '([a-z0-9]+\.)*[a-z0-9]+|'
  PoolName:
    Type: String
    Default: tabcam
    Description: The identity pool's name (tabcam-local for the local pool)
    AllowedPattern: '[a-z-]+'
  AppleClientId:
    Type: String
    Default: ''
    Description: >
      Sign in with Apple: the audience of Apple's ID tokens, the app's
      bundle ID (com.nu01.tabcam) for native sign-in on iOS. Empty: Google
      only.
    AllowedPattern: '([A-Za-z0-9-]+\.)+[A-Za-z0-9-]+|'
  AppleServicesId:
    Type: String
    Default: ''
    Description: >
      With AppleClientId: the Services ID (com.nu01.tabcam.signin) of Sign
      in with Apple's web flow (on Android), trusted beside the bundle ID
      by the Apple provider. Empty: the bundle ID only.
    AllowedPattern: '([A-Za-z0-9-]+\.)+[A-Za-z0-9-]+|'

  EmailProviderName:
    Type: String
    Default: ''
    Description: >
      Sign in with email: the tabcam-email user pool as the pool's provider
      (tabcam-email-signin's ProviderName, the app's Logins key). Empty:
      none.
    AllowedPattern: '(cognito-idp\.[a-z0-9-]+\.amazonaws\.com/[A-Za-z0-9_-]+)?'
  EmailClientId:
    Type: String
    Default: ''
    Description: With EmailProviderName, the user pool's app client
    AllowedPattern: '[a-z0-9]*'

Conditions:
  HasEmail: !Not [!Equals [!Ref EmailProviderName, '']]
  HasApple: !Not [!Equals [!Ref AppleClientId, '']]
  HasAppleServicesId: !Not [!Equals [!Ref AppleServicesId, '']]
  HasDeveloperProvider: !Not [!Equals [!Ref DeveloperProviderName, '']]
  MakesGoogleProvider: !Equals [!Ref GoogleProviderArn, '']
  HasAppClients: !Not [!Equals [!Ref GoogleAppClientIds, '']]

Resources:
  # Google's sign-in, for every TabCam client: the web client and the
  # apps' own (their tokens name them). The app's Logins key stays
  # accounts.google.com.
  GoogleProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakesGoogleProvider
    # The account's one accounts.google.com provider (the local pool's
    # too): never deleted with the stack.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://accounts.google.com
      ClientIdList: !If
        - HasAppClients
        - !Split [',', !Sub '${GoogleWebClientId},${GoogleAppClientIds}']
        - [!Ref GoogleWebClientId]

  # Sign in with Apple, for the bundle ID (iOS) and the Services ID (the web
  # flow, on Android). The pool's built-in Apple login takes one client ID
  # (a semicolon-separated value is taken literally: tried 2026-10-21), so
  # Apple goes through an OpenID Connect provider too. The app's Logins key
  # stays appleid.apple.com. Folders are the profiles' (the share API finds
  # a profile by the sign-in's issuer and sub), so the move kept them.
  AppleProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: HasApple
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://appleid.apple.com
      ClientIdList: !If
        - HasAppleServicesId
        - [!Ref AppleClientId, !Ref AppleServicesId]
        - [!Ref AppleClientId]

  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Ref PoolName
      AllowUnauthenticatedIdentities: false
      AllowClassicFlow: false
      DeveloperProviderName: !If [HasDeveloperProvider, !Ref DeveloperProviderName, !Ref AWS::NoValue]
      # Each provider's users are their own identities (folders): the same
      # person signed in with Google and with Apple has two.
      CognitoIdentityProviders: !If
        - HasEmail
        - - ProviderName: !Ref EmailProviderName
            ClientId: !Ref EmailClientId
            ServerSideTokenCheck: false
        - !Ref AWS::NoValue
      OpenIdConnectProviderARNs: !If
        - HasApple
        - - !If [MakesGoogleProvider, !Ref GoogleProvider, !Ref GoogleProviderArn]
          - !Ref AppleProvider
        - - !If [MakesGoogleProvider, !Ref GoogleProvider, !Ref GoogleProviderArn]

  AuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Signed-in TabCam users (Cognito identity pool, Google or Apple)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: own-events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Each user reaches only <bucket>/<their identity ID>/...
              # Deleting is allowed (removed pages, deleted events): the bucket
              # is versioned, so a deletion can be undone for 30 days.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub
                  - ${BucketArn}/${!cognito-identity.amazonaws.com:sub}/*
                  - BucketArn: !ImportValue tabcam-user-data-bucket-arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !ImportValue tabcam-user-data-bucket-arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - ${cognito-identity.amazonaws.com:sub}
                      - ${cognito-identity.amazonaws.com:sub}/*

  IdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthenticatedRole.Arn

Outputs:
  IdentityPoolId:
    Description: >
      The app's TABCAM_COGNITO_IDENTITY_POOL_ID (the local pool's:
      TABCAM_COGNITO_LOCAL_IDENTITY_POOL_ID)
    Value: !Ref IdentityPool
    Export:
      # tabcam-identity-pool-id for the main pool, which the share API imports.
      Name: !Sub ${AWS::StackName}-pool-id
  AuthenticatedRoleArn:
    Value: !GetAtt AuthenticatedRole.Arn
  GoogleProviderArn:
    Condition: MakesGoogleProvider
    Description: The accounts.google.com provider, for tabcam-identity-local's GoogleProviderArn
    Value: !Ref GoogleProvider
