AWSTemplateFormatVersion: '2010-09-09'
Description: >
  tabscan-ocr-repo: the ECR repository of the cloud OCR image
  (tabscan_locr/). Its own stack, so the image can be pushed before the
  tabscan-ocr stack's functions are created from it.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: tabscan-ocr
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "Keep the last 10 images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
            "action": {"type": "expire"}}]}

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
