AWSTemplateFormatVersion: '2010-09-09'
Description: >
  tabscan-identity: a Cognito identity pool that trusts Google sign-in. The
  app exchanges the signed-in user's Google ID token for temporary AWS
  credentials of the authenticated role, which may only read, write and
  delete that user's own folder in the user-data bucket (tabscan-user-data
  stack). Guests (unauthenticated identities) aren't allowed.

Parameters:
  GoogleWebClientId:
    Type: String
    Description: >
      The Google "Web application" OAuth client ID. Every platform's ID token
      is issued for it (web directly; Android and iOS as their server client).
    AllowedPattern: '[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com'

Resources:
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: tabscan
      AllowUnauthenticatedIdentities: false
      AllowClassicFlow: false
      SupportedLoginProviders:
        accounts.google.com: !Ref GoogleWebClientId

  AuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Signed-in TabScan users (Cognito identity pool, Google)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: own-events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Each user reaches only <bucket>/<their identity ID>/...
              # Deleting is allowed (removed pages, deleted events): the bucket
              # is versioned, so a deletion can be undone for 30 days.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub
                  - ${BucketArn}/${!cognito-identity.amazonaws.com:sub}/*
                  - BucketArn: !ImportValue tabscan-user-data-bucket-arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !ImportValue tabscan-user-data-bucket-arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - ${cognito-identity.amazonaws.com:sub}
                      - ${cognito-identity.amazonaws.com:sub}/*

  IdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthenticatedRole.Arn

Outputs:
  IdentityPoolId:
    Description: The app's TABSCANNER_COGNITO_IDENTITY_POOL_ID
    Value: !Ref IdentityPool
    Export:
      Name: tabscan-identity-pool-id
  AuthenticatedRoleArn:
    Value: !GetAtt AuthenticatedRole.Arn
