AWSTemplateFormatVersion: '2010-09-09'
Description: >
  A Cognito identity pool that trusts Google sign-in (through an IAM OpenID
  Connect provider for accounts.google.com, which takes every TabScan
  Google client) and, when AppleClientId is set, Sign in with Apple for the
  app's bundle ID. The app
  exchanges the signed-in user's ID token for temporary AWS
  credentials of the authenticated role, which may only read, write and
  delete that user's own folder in the user-data bucket (tabscan-user-data
  stack). Guests (unauthenticated identities) aren't allowed. Deployed
  twice: tabscan-identity (pool tabscan, the web client: every build but
  local web ones) and tabscan-identity-local (pool tabscan-local, the local
  web client). The pool's built-in Google login takes one client ID, but
  an app's token names its own client too (iOS: aud is the web client, azp
  the iOS client), which that login refuses; the OpenID Connect provider
  takes a list. An account has one provider per URL: tabscan-identity
  makes it, tabscan-identity-local uses it (GoogleProviderArn).

Parameters:
  GoogleWebClientId:
    Type: String
    Description: >
      The Google "Web application" OAuth client ID the pool trusts: the web
      client (every platform's ID token is issued for it: web directly,
      Android and iOS as their server client), or for the local pool the
      "local - web" client (TABSCANNER_GOOGLE_LOCAL_WEB_CLIENT_ID).
    AllowedPattern: '[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com'
  GoogleAppClientIds:
    Type: String
    Default: ''
    Description: >
      The other Google clients whose tokens the pools take, separated by
      commas: the iOS client, the "local - web" client (for the local
      pool) and each Android signing key's client. Only where the provider
      is made (GoogleProviderArn empty).
    AllowedPattern: '([0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com)?(,[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com)*'
  GoogleProviderArn:
    Type: String
    Default: ''
    Description: >
      The accounts.google.com OpenID Connect provider to use (the local
      pool: tabscan-identity's GoogleProviderArn output). Empty: this stack
      makes it.
  PoolName:
    Type: String
    Default: tabscan
    Description: The identity pool's name (tabscan-local for the local pool)
    AllowedPattern: '[a-z-]+'
  AppleClientId:
    Type: String
    Default: ''
    Description: >
      Sign in with Apple: the audience of Apple's ID tokens, the app's
      bundle ID (com.nu01.tabscan) for native sign-in on iOS. Empty: Google
      only.
    AllowedPattern: '([A-Za-z0-9-]+\.)+[A-Za-z0-9-]+|'

Conditions:
  HasApple: !Not [!Equals [!Ref AppleClientId, '']]
  MakesGoogleProvider: !Equals [!Ref GoogleProviderArn, '']
  HasAppClients: !Not [!Equals [!Ref GoogleAppClientIds, '']]

Resources:
  # Google's sign-in, for every TabScan client: the web client and the
  # apps' own (their tokens name them). The app's Logins key stays
  # accounts.google.com.
  GoogleProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakesGoogleProvider
    Properties:
      Url: https://accounts.google.com
      ClientIdList: !If
        - HasAppClients
        - !Split [',', !Sub '${GoogleWebClientId},${GoogleAppClientIds}']
        - [!Ref GoogleWebClientId]

  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Ref PoolName
      AllowUnauthenticatedIdentities: false
      AllowClassicFlow: false
      # Each provider's users are their own identities (folders): the same
      # person signed in with Google and with Apple has two.
      OpenIdConnectProviderARNs:
        - !If [MakesGoogleProvider, !Ref GoogleProvider, !Ref GoogleProviderArn]
      SupportedLoginProviders: !If
        - HasApple
        - appleid.apple.com: !Ref AppleClientId
        - !Ref AWS::NoValue

  AuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Signed-in TabScan users (Cognito identity pool, Google or Apple)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: own-events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Each user reaches only <bucket>/<their identity ID>/...
              # Deleting is allowed (removed pages, deleted events): the bucket
              # is versioned, so a deletion can be undone for 30 days.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub
                  - ${BucketArn}/${!cognito-identity.amazonaws.com:sub}/*
                  - BucketArn: !ImportValue tabscan-user-data-bucket-arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !ImportValue tabscan-user-data-bucket-arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - ${cognito-identity.amazonaws.com:sub}
                      - ${cognito-identity.amazonaws.com:sub}/*

  IdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthenticatedRole.Arn

Outputs:
  IdentityPoolId:
    Description: >
      The app's TABSCANNER_COGNITO_IDENTITY_POOL_ID (the local pool's:
      TABSCANNER_COGNITO_LOCAL_IDENTITY_POOL_ID)
    Value: !Ref IdentityPool
    Export:
      # tabscan-identity-pool-id for the main pool, which the share API imports.
      Name: !Sub ${AWS::StackName}-pool-id
  AuthenticatedRoleArn:
    Value: !GetAtt AuthenticatedRole.Arn
  GoogleProviderArn:
    Condition: MakesGoogleProvider
    Description: The accounts.google.com provider, for tabscan-identity-local's GoogleProviderArn
    Value: !Ref GoogleProvider
